set -g status-keys vi
setw -g mode-keys vi
# enter copy mode with escape key
unbind [
bind Escape copy-mode
# start selecting text with "v"
bind-key -T copy-mode-vi 'v' send -X begin-selection
# copy text with "y"
bind-key -T copy-mode-vi 'y' send -X copy-selection
set -g mouse on

# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 40

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 2s
set -g display-time 2000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5

# set status bar position
set-option -g status-position top

# start pane numbering at 1
setw -g pane-base-index 1
# start window numbering at 1
set -g base-index 1
set -g renumber-windows on

# Set C-a as primary prefix for manual tmux usage, and use C-b as
# a dedicated secondary prefix for Terminal-injected key sequences to
# avoid accidental C-a passthrough noise when keys are spammed.
set -g prefix C-a
set -g prefix2 C-b
unbind C-b
bind -r C-a send-prefix

bind-key C-s last-window

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# maximaize pane
bind -r m resize-pane -Z

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# Moving window
bind-key -r H swap-window -t -1 \; previous-window
bind-key -r L swap-window -t +1 \; next-window

# clear screen under vim-tmux-navigator
bind-key C-l send-keys 'C-l'

unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"
bind - split-window -c "#{pane_current_path}"
bind "|" split-window -h -c "#{pane_current_path}"
unbind x
bind x if-shell -F '#{||:#{||:#{==:#{pane_current_command},zsh},#{==:#{pane_current_command},bash}},#{==:#{pane_current_command},sh}}' 'kill-pane' 'confirm-before -p "kill-pane #P running #{pane_current_command}? (y/n)" kill-pane'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Status layout:
# - window titles on the left
# - right side shows optional cwd then session (session always far right)
set -g status-justify left
set -g status-left ""
set -g status-left-length 0
set -g status-right-length 250
set -g status-right '#{?#{==:#{pane_current_command},nvim},#[fg=default]#[bg=colour8] [#{s|#{HOME}|~|:pane_current_path}] ,}#[fg=colour0,bg=colour13] #{?client_prefix,*, }#S '

# Blend with terminal default colors (no hardcoded palette)
set -g status-style "fg=default,bg=colour8"
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour13"
set -g window-status-separator ""
set -g window-status-format '#[fg=default,bg=colour8] #I #W '
set -g window-status-current-format '#[fg=colour0,bg=colour13] #{?window_zoomed_flag,+,}#I #W '

# Window title marker for external tools (e.g., Hammerspoon).
# Marker is U+2800 (Braille Pattern Blank), emitted as UTF-8 bytes E2 A0 80.
set -g set-titles on
set -g set-titles-string '#(printf "\342\240\200") #S'
